name: Docker

on:
  push:
    branches: [master]
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build docker image
        run: ./docker/build-docker.bash --pull --no-cache

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push unstable tag (branch builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          docker tag edoardoromiti/concert_description-ros1-legacy:latest edoardoromiti/concert_description-ros1-legacy:unstable
          docker push edoardoromiti/concert_description-ros1-legacy:unstable

      - name: Push latest and version tag (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker push edoardoromiti/concert_description-ros1-legacy:latest
          docker tag edoardoromiti/concert_description-ros1-legacy:latest edoardoromiti/concert_description-ros1-legacy:${{ github.ref_name }}
          docker push edoardoromiti/concert_description-ros1-legacy:${{ github.ref_name }}
