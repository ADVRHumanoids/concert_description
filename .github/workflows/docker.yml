name: Docker (GHCR)

on:
  push:
    branches: [master, ros2]
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
    branches: [ros2]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/advrhumanoids/concert_description

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build docker image
        run: |
          ./docker/build-docker.bash --pull --no-cache \
            --label "org.opencontainers.image.revision=$GITHUB_SHA"

      - name: Login to GHCR
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Compute image tag
        if: github.event_name == 'push'
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_NAME" = "master" ]; then
            echo "tag=ros1-legacy" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Push image
        if: github.event_name == 'push'
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ "$IMAGE_TAG" != latest ]; then
            docker tag "$IMAGE:latest" "$IMAGE:$IMAGE_TAG"
          fi
          docker push "$IMAGE:$IMAGE_TAG"
          docker tag "$IMAGE:latest" "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
